# EXP-013-s8 — CF-MR-004/HYP-001 S8_RVINDEX (relative-value index: pair spread − rolling median W=60).
# Native pending orders (Mode=3), 4h anchor, resting bracket (no z-gate), form-2 TP at anchor mean
# (= feedLog + C_t + mean), horizon fallback. See EXP-013.conf header. Same 5 pairs as S6; series=S8_RVINDEX.

MODE=3
BALANCE=100000000            # prevent ruin-truncation on high-notional indices (bps analysis balance-independent)
STRATEGY="cross_instrument_spread_mr"
STRATEGY_VALUE="5"

SYMBOLS=(EURUSD AUDUSD USDCHF USTEC US500)
DOMAINS=(4h)

ANALYSIS_END=(
  [EURUSD]="2024-08-25T22:19:00Z"
  [AUDUSD]="2024-09-06T14:40:00Z"
  [USDCHF]="2024-09-09T00:05:00Z"
  [USTEC]="2024-08-26T01:06:00Z"
  [US500]="2024-09-17T17:26:00Z"
)
BACKTEST_END=(
  [EURUSD]="25/08/2024 22:19"
  [AUDUSD]="06/09/2024 14:40"
  [USDCHF]="09/09/2024 00:05"
  [USTEC]="26/08/2024 01:06"
  [US500]="17/09/2024 17:26"
)

MODEL_ARGS_BY_SYMBOL=(
  [EURUSD]="--CisSeries=S8_RVINDEX --BasketMates=GBPUSD"
  [AUDUSD]="--CisSeries=S8_RVINDEX --BasketMates=NZDUSD"
  [USDCHF]="--CisSeries=S8_RVINDEX --BasketMates=USDCAD"
  [USTEC]="--CisSeries=S8_RVINDEX --BasketMates=US500"
