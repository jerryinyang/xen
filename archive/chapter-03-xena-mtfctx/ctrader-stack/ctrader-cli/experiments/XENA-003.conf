# XENA-003 — MTFCTX-C3 (CTRL-03 NAIVE REVERSION), third live XENA universe.
# Design: python/experiments/XENA-003/design.md (QA APPROVE run 1, design-stage).
# 36 cells = 12 symbols x 3 LTF domains; the MtfCtxReversion model hosts all 76
# variant x hold candidates per cell and self-emits per-candidate directories
# under data/strategy_runs/XENA-003/. HTF is derived in-model from the LTF
# domain (1h->1d, 15m->4h, 5m->1h — the three registered pairs).
#
# EXECUTION CONTRACT: NativeOrders mode (EXP-013 carve-out) — real cTrader
# limit orders, engine m1 fills. MODE=3 (XenMode.NativeOrders).
#
# EXECUTION GATE: operator execution approval required (XENA sequencing per
# checkpoint 011; CTRL-03 last — hardest execution contract).
#
# Uniform fence (design §5): AnalysisEndUtc = 2024-12-11T08:19:00Z for ALL
# symbols (= min per-instrument 70% analysis cutoff; binding instrument GER40).

STRATEGY="mtfctx_c3"
STRATEGY_VALUE="4"   # XenStrategy.MtfCtxReversion
MODE="3"             # XenMode.NativeOrders

# 76 concurrent min-volume positions + <=152 resting limits per feed: a large
# balance prevents margin rejections / ruin-truncation on high-notional
# instruments (candidates never size — the Python oracle does all sizing;
# selection reads bps, balance-independent).
BALANCE="100000000"

