# Per-experiment cTrader-CLI config — copy to <EXP-ID>.conf and edit.
# Sourced by run-experiment.sh. Defines the cells, the model, and the holdout fence.
#
# STRATEGY      : the StrategyName the C# model reports (also the run-dir prefix).
# STRATEGY_VALUE: the XenStrategy enum integer (Xen.cs CreateStrategyModel switch).
# SYMBOLS       : instruments to run (must exist in the cached m1 data).
# DOMAINS       : resampled domains (5m|15m|30m|1h|2h|4h).
# ANALYSIS_END  : per-symbol AnalysisEndUtc (ISO-8601 Z) — the holdout fence. The C# host
#                 emits NO row at/after this timestamp. Set it to each file's first-70%
#                 analysis cutoff so the run never touches the global holdout.
# BACKTEST_END  : per-symbol cTrader backtest end (dd/MM/yyyy HH:mm), one minute past the
#                 last bar you want processed.
# MODEL_ARGS    : optional extra --Param=value pairs passed to the robot (model params).

STRATEGY="ExampleNull"
STRATEGY_VALUE="4"

SYMBOLS=(EURUSD XAUUSD)
DOMAINS=(1h 4h)

ANALYSIS_END=(
  [EURUSD]="2024-09-01T00:00:00Z"
  [XAUUSD]="2024-09-01T00:00:00Z"
)
BACKTEST_END=(
  [EURUSD]="01/09/2024 00:01"
  [XAUUSD]="01/09/2024 00:01"
)

MODEL_ARGS=()  # e.g. (--FastMa=20 --SlowMa=50)
