# EXP-013-s6 — CF-MR-004/HYP-001 S6_PAIR (fixed-ratio pair, β=1: spread = logP^A − logP^B). Native
# pending orders (Mode=3), 4h anchor, resting bracket (no z-gate), form-2 TP at anchor mean, horizon
# fallback. See EXP-013.conf header. 5 predeclared pairs (traded → single peer); series=S6_PAIR.
#   EURUSD/GBPUSD · AUDUSD/NZDUSD · USDCHF/USDCAD · USTEC/US500 · US500/US2000

MODE=3
BALANCE=100000000            # prevent ruin-truncation on high-notional indices (bps analysis balance-independent)
STRATEGY="cross_instrument_spread_mr"
STRATEGY_VALUE="5"

SYMBOLS=(EURUSD AUDUSD USDCHF USTEC US500)
DOMAINS=(4h)

ANALYSIS_END=(
  [EURUSD]="2024-08-25T22:19:00Z"
  [AUDUSD]="2024-09-06T14:40:00Z"
  [USDCHF]="2024-09-09T00:05:00Z"
  [USTEC]="2024-08-26T01:06:00Z"
  [US500]="2024-09-17T17:26:00Z"
)
BACKTEST_END=(
  [EURUSD]="25/08/2024 22:19"
  [AUDUSD]="06/09/2024 14:40"
  [USDCHF]="09/09/2024 00:05"
  [USTEC]="26/08/2024 01:06"
  [US500]="17/09/2024 17:26"
)

# Single peer per traded instrument (B leg of the pair).
MODEL_ARGS_BY_SYMBOL=(
  [EURUSD]="--CisSeries=S6_PAIR --BasketMates=GBPUSD"
  [AUDUSD]="--CisSeries=S6_PAIR --BasketMates=NZDUSD"
  [USDCHF]="--CisSeries=S6_PAIR --BasketMates=USDCAD"
  [USTEC]="--CisSeries=S6_PAIR --BasketMates=US500"
  [US500]="--CisSeries=S6_PAIR --BasketMates=US2000"
)

MODEL_ARGS=(--BasketPhaseShiftHours=60)
