# EXP-019 delay-twin tripwire (design paragraph 7, tripwire 3): NZDUSD, ALL schedule bars
# shifted +1 calendar bar, all 25 seeds. For a genuinely unconditioned strategy this is just
# another draw - the battery mean must be statistically indistinguishable from the live arm.
# Same fence/machinery as EXP-019.conf; schedules ..._seed<i>_shift1.csv.
: "${EXP019_SEED:?set EXP019_SEED=1..25 (use run-exp019-all.sh)}"

MODE=3
BALANCE=100000000
STRATEGY="random_hold"
STRATEGY_VALUE="6"

SYMBOLS=(NZDUSD)
DOMAINS=(4h)

ANALYSIS_END=(
  [NZDUSD]="2024-09-06T05:42:00Z"
)
BACKTEST_END=(
  [NZDUSD]="06/09/2024 05:42"
)

MODEL_ARGS=()
MODEL_ARGS_BY_SYMBOL=(
  [NZDUSD]="--RhSchedulePath=/workspace/tools/ctrader-cli/experiments/schedules/EXP-019/EXP-019-4h-NZDUSD_seed${EXP019_SEED}_shift1.csv --RhSeed=${EXP019_SEED}"
)
