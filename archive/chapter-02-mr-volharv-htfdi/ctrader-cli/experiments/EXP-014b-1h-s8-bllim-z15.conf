# EXP-014b — CF-MR-004/HYP-003 streamlined S8 rerun (amendment-003, Increment B: BOTH-LEG).
# disclosure: both-leg entry=limit (atomic desync), z*=1.5
# Grouped-spread position: short/long A + the equal-weight basket mates as N+1 real cTrader legs
# (SpreadPositionId groups them). Exit = joint form-1 (spread reverts through mean); reentry forced
# none; cost sums all N+1 legs in Python (L-02). Native cTrader orders (Mode=3=NativeOrders), m1
# fills. Entry sub-axis limit: ATOMIC — A rests band-limits, mates rest at <=t-1 close on A-fill; unwind any partial next bar.
# Availability read reuses the single-leg PRIMARY emission; both-leg = tradability disclosure axis.
# Fence = EXP-013 first-49% TRAIN cutoffs (byte-identical to the single-leg confs). 0 counted reads.

