# anomaly (PRICE-PRIMARY, 4h). RandomHold: seeded random-timing, random-direction, fixed-hold
# {6,12,24,48} round-robin market legs; native cTrader market orders (Mode=3), m1 fills; NO
# TP/SL/refresh; inventory cap 6 (cap_skip). Schedules pre-generated from (seed, engine bar
# calendar) ONLY: gen_exp019_schedules.py; base seed 20260705, seed_i = base+i, i=1..25.
# Seed selected via EXP019_SEED (one run per seed per instrument; 16x25 = 400 runs).
# Fence = EXP-013/018 per-instrument 49% TRAIN cutoffs (band identity with the EXP-018
# anomaly). TRAIN band only; TEST/holdout never emitted. 0 counted reads. Analysis-only
# Python on this emission (L-01). Deviations D1-D6: Xen.RandomHold.cs.
