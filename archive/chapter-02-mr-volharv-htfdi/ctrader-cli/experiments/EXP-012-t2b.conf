# EXP-012 T2b — CF-MR-003 CONC-1 Track 2: form-2 limit-at-anchor MR fade, S5_SPREAD, exec-15m.
# PRICE-PRIMARY. Model: StrategyHost/CrossDomainMrLimitModel.cs (cross_domain_mr_limit),
# --CdmSeries=S5_SPREAD: MULTI-SYMBOL exec-grid rolling-beta class-mate basket anchor (W_Z=200
# exec-15m), computed IN-ENGINE via MarketData.GetBars (--BasketMates). Identical to EXP-010 T1
# but on the 15m exec grid. VR&HL selector, |z|>=2 fade, form-2 favourable limit at anchor mean,
# horizon fallback.
#
# Member set = 10 S5_SPREAD|4h/15m admitted cells (EXP-009 per_cell.parquet, any_pass):
#   AUDUSD EURUSD GBPUSD NZDUSD USDCAD USDCHF USDJPY (FX_MAJORS), US2000 US500 USTEC (INDICES).
# Per-symbol ANALYSIS_END = FIRST-49% train cutoff int(int(N_m1*0.7)*0.7); host emits NO 15m bar
# at/after it (analysis-TEST + final-30% holdout sealed). DOMAINS=15m; frozen referee domain="15m"
# (EXP-011, L-12). Basket mates = asset-class class-mates MINUS self (cross_domain_mr.S5_CLASSES).
# Output -> data/strategy_runs/EXP-012-t2b/.

EXP_ID="EXP-012-t2b"
STRATEGY="cross_domain_mr_limit"
