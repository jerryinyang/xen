# EXP-013 — CF-MR-004/HYP-001: cross-instrument spread MR fade. PRICE-PRIMARY (4h anchor, no lower-domain).
# ROUTE A — NATIVE cTrader pending orders (Mode=3=NativeOrders); cTrader's m1 backtester owns fill
# resolution. Planner: StrategyHost/CrossInstrumentSpreadPlanner.cs (from scratch, L-13). Robot places
# a resting bracket each 4h bar (sell-limit at exp(anchor+2σ), buy-limit at exp(anchor−2σ), both ≤ t-1);
# band IS the trigger (NO z pre-gate — resting-bracket, operator-ratified 2026-07-01). Whichever fills
# → form-2 TP at exp(anchor) (fixed at entry), sibling cancelled (/REENTRY=none). Horizon fallback
# H_i=min(48,3·HL) 4h bars → market close at bar open. MR screen (VR/HL) = INFORMATIVE (not gating, L-12).
#
# This conf = S5_SPREAD (rolling-β basket). S6/S7/S8 = EXP-013-s6/-s7/-s8.conf (same cutoffs, different
# series + peers). ANALYSIS_END/BACKTEST_END = each file's first-49% cutoff (int(int(N·0.7)·0.7) row
# CloseTime) — the TRAIN fence; seals the analysis-TEST band and the final-30% global holdout.

MODE=3                       # XenMode.NativeOrders — native pending orders (m1 fills)
BALANCE=100000000            # prevent ruin-truncation on high-notional indices (bps analysis balance-independent)
STRATEGY="cross_instrument_spread_mr"
STRATEGY_VALUE="5"           # XenStrategy.CrossInstrumentSpreadMr ordinal

SYMBOLS=(EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD USTEC US500 US2000 JP225)
DOMAINS=(4h)

