# PRICE-PRIMARY. Model: StrategyHost/CrossDomainMrLimitModel.cs (cross_domain_mr_limit),
# --CdmSeries=S3_DETREND: SINGLE-SYMBOL rolling-OLS log(price)~time trendline residual anchor
# (W_Z=200 exec-15m, RollingOlsTimeFit == cross_domain_mr.rolling_ols_fit). NO basket. VR&HL
# selector, |z|>=2 fade, live-limit entry at the z=+/-2 band edge, form-2 favourable limit at
# the trendline anchor mean a[t-1], horizon fallback H_i=min(48,3*HL_i) exec-15m bars.
#
# Member set = 14 S3_DETREND|4h/15m admitted cells (EXP-009 per_cell.parquet, any_pass):
