# Per-symbol ANALYSIS_END = each file's FIRST-49% train sub-split cutoff int(int(N_m1*0.7)*0.7);
# the host emits NO 15m bar at/after it (analysis-TEST band + final-30% global holdout sealed).
# DOMAINS=15m; frozen renewed referee domain="15m" (EXP-011, L-12). Output ->
# data/strategy_runs/EXP-012-t2a/. (Separate EXP_ID from t2b so the shared-symbol run_ids
