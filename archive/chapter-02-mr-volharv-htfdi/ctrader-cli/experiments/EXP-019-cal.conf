# EXP-019 (CF-VOLHARV-001) — CALENDAR-EMISSION pre-runs (deviation D1, Xen.RandomHold.cs).
# RandomHold with RH Schedule Path EMPTY: no orders placed; per-bar records only. Emits the
# engine's broker-aligned 4h bar calendar per instrument (timestamps), which
# gen_exp019_schedules.py consumes (timestamps ONLY, never prices) to generate the seeded
# schedules. Run BEFORE schedule generation.
# Fence = EXP-013/018 per-instrument 49% TRAIN cutoffs (operator-selected, band identity with
# the EXP-018 anomaly; 2023-vintage base files, idx-1 CloseTime convention). TRAIN band only;
# TEST/holdout never emitted. 0 counted reads.

