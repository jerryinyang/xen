# EXP-010-shuffle — CONC-1 T1 LEAK TRIPWIRE (design §7): the IDENTICAL in-engine model on a
# phase-shifted basket feed. --BasketPhaseShiftHours>0 decorrelates the S5 basket from the traded
# price: the cross-domain co-movement (the edge source) is destroyed, each series' marginal +
# autocorrelation preserved. VR&HL + beta + limit fills then key off noise; the net per-cell edge
# MUST collapse to within referee FPR. A surviving net edge => leak => REJECT. Same 5 cells,
# same fences, same mates as EXP-010.conf; only the phase shift is added. Output ->
# data/strategy_runs/EXP-010-shuffle/.

STRATEGY="cross_domain_mr_limit"
STRATEGY_VALUE="4"

SYMBOLS=(AUDUSD GBPUSD NZDUSD US2000 US500)
DOMAINS=(1h)

ANALYSIS_END=(
  [AUDUSD]="2023-11-21T03:29:00Z"
  [GBPUSD]="2023-11-21T20:10:00Z"
  [NZDUSD]="2023-11-21T07:19:00Z"
  [US2000]="2023-11-20T15:47:00Z"
  [US500]="2023-11-22T05:06:00Z"
)
BACKTEST_END=(
  [AUDUSD]="21/11/2023 03:29"
  [GBPUSD]="21/11/2023 20:10"
  [NZDUSD]="21/11/2023 07:19"
  [US2000]="20/11/2023 15:47"
  [US500]="22/11/2023 05:06"
)

MODEL_ARGS_BY_SYMBOL=(
  [AUDUSD]="--BasketMates=EURUSD;GBPUSD;USDJPY;USDCHF;USDCAD;NZDUSD"
  [GBPUSD]="--BasketMates=EURUSD;USDJPY;USDCHF;USDCAD;AUDUSD;NZDUSD"
  [NZDUSD]="--BasketMates=EURUSD;GBPUSD;USDJPY;USDCHF;USDCAD;AUDUSD"
  [US2000]="--BasketMates=USTEC;US500;JP225"
  [US500]="--BasketMates=USTEC;US2000;JP225"
)

# Phase-shift the basket 2000h (~83 days, >> W_Z=200 1h) back -> contemporaneous cross-domain
# structure destroyed, basket marginal/autocorr intact. The one difference vs EXP-010.conf.
MODEL_ARGS=(--BasketPhaseShiftHours=2000)
