# EXP-010 — CF-MR-003 CONC-1 Track 1: form-2 limit-at-anchor MR fade. PRICE-PRIMARY.
# Model: StrategyHost/CrossDomainMrLimitModel.cs (cross_domain_mr_limit). S5_SPREAD
# EXEC-GRID rolling-beta anchor (W_Z=200 1h), computed IN-ENGINE from the class-mate
# basket via MarketData.GetBars (--BasketMates); VR&HL selector, |z|>=2 fade, live-limit
# entry at the z=+/-2 band edge, form-2 favourable limit at anchor mean, horizon fallback.
#
# Member set = 5 DISTINCT S5 exec-1h admitted cells (EXP-009 per_cell.parquet; the 1D/4h
# anchor-label split is degenerate for exec-grid-beta S5 -> collapsed, design.md §3):
#   AUDUSD/GBPUSD/NZDUSD (FX_MAJORS basket), US2000/US500 (INDICES basket).
# Per-symbol ANALYSIS_END = each file's FIRST-49% (train sub-split) cutoff = the fence:
#   int(int(N_m1*0.7)*0.7); the host emits NO domain bar at/after it (analysis-TEST band +
#   final-30% global holdout both sealed). DOMAINS=1h only; frozen referee domain="1h" (L-12).
# Basket mates = asset-class class-mates MINUS self (cross_domain_mr.S5_CLASSES / _S5_MATES).

STRATEGY="cross_domain_mr_limit"
STRATEGY_VALUE="4"          # XenStrategy.CrossDomainMrLimit ordinal

SYMBOLS=(AUDUSD GBPUSD NZDUSD US2000 US500)
DOMAINS=(1h)

ANALYSIS_END=(
  [AUDUSD]="2023-11-21T03:29:00Z"
  [GBPUSD]="2023-11-21T20:10:00Z"
  [NZDUSD]="2023-11-21T07:19:00Z"
  [US2000]="2023-11-20T15:47:00Z"
  [US500]="2023-11-22T05:06:00Z"
)
BACKTEST_END=(
  [AUDUSD]="21/11/2023 03:29"
  [GBPUSD]="21/11/2023 20:10"
  [NZDUSD]="21/11/2023 07:19"
  [US2000]="20/11/2023 15:47"
  [US500]="22/11/2023 05:06"
)

# S5 class-mates (class minus self); the model averages log(Close) over the RESOLVED mates
# (drop-to-available, matching build_baskets np.nanmean). FX_MAJORS = EURUSD,GBPUSD,USDJPY,
# USDCHF,USDCAD,AUDUSD,NZDUSD; INDICES = USTEC,US500,US2000,JP225.
MODEL_ARGS_BY_SYMBOL=(
  [AUDUSD]="--BasketMates=EURUSD;GBPUSD;USDJPY;USDCHF;USDCAD;NZDUSD"
  [GBPUSD]="--BasketMates=EURUSD;USDJPY;USDCHF;USDCAD;AUDUSD;NZDUSD"
  [NZDUSD]="--BasketMates=EURUSD;GBPUSD;USDJPY;USDCHF;USDCAD;AUDUSD"
  [US2000]="--BasketMates=USTEC;US500;JP225"
  [US500]="--BasketMates=USTEC;US2000;JP225"
)

MODEL_ARGS=()  # selector/exit constants are frozen model constants — no global params.
