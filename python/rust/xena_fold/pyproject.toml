[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "xena-fold"
version = "0.1.0"
description = "XENA oracle sequential event-fold kernel (INFR-007). Byte-identical Rust port of the xen.xena.oracle evaluate() event loop."
requires-python = ">=3.13"

[tool.maturin]
module-name = "xena_fold"
