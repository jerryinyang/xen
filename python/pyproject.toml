[project]
name = "xen"
version = "0.1.0"
description = "Thesis-agnostic data-layer infrastructure for intraday-trading research (chart-type generators and OHLC resampling)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alpaca-py>=0.43.4",
    "ccxt>=4.5.58",
    "diptest>=0.11.0",
    "matplotlib>=3.10.9",
    # INFR-010 Phase B: hard pin (R5). One-platform rule (INFR-007 caveat):
    # pin recorded for macosx_15_0_arm64 / CPython 3.14 — do not upgrade without INFR.
    "nautilus_trader==1.230.0",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
